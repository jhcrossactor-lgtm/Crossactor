# ヴィラPV パイプライン設定（物件単位）
# モデル名・エンドポイントはここだけで差し替える。コードにハードコードしていない。

image:
  provider: openai
  # 2026-09-08 リリースの gpt-image-2.5 系。sunburst=高精度/低速, flare=高速。
  model: gpt-image-2.5-sunburst
  endpoint: https://api.openai.com/v1/images/edits
  # bearer = .env のキーで自分で認証する（ローカル実行はこちら）
  # proxy  = Authorizationを付けない。クラウド環境の API credentials 側で注入させる
  auth: bearer
  api_key_env: OPENAI_API_KEY
  # 16:9 ちょうど。幅・高さとも16の倍数という制約を満たす値。
  size: "2048x1152"
  # low / medium / high / xhigh / max（xhigh と max は 2.5系のみ）
  quality: high
  output_format: png            # png / webp / jpeg
  # response_format と input_fidelity は送らない。
  # 前者は gpt-image 系では400、後者は gpt-image-2 以降は常に高忠実度で処理されるため不要。
  max_reference_images: 16      # 1枚目=編集対象を含めた上限
  # 送信前に全画像を RGB PNG に正規化し、長辺をこの値以下に縮小する。
  # iPhone写真の色モード(CMYK等)・EXIF回転・巨大サイズで API に弾かれるのを防ぐ。
  # 入力トークン（画素数/1024）も抑えられる。
  max_input_edge: 2048
  timeout_sec: 600
  max_retries: 3

video:
  provider: minimax             # gemini | minimax | mock
  gemini:
    # Gemini API の image-to-video。エンドポイントは公式ディスカバリで確認済み:
    #   POST {base_url}/models/{model}:predictLongRunning
    #   GET  {base_url}/{operation.name}
    model: gemini-omni-1.1-flash
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
    aspect_ratio: "16:9"
    resolution: "1080p"
    generate_audio: false       # 各カットの環境音は使わず、BGMは stage3 で載せる方針
    negative_prompt: "建物の変形, 歪み, 余分な人物, 文字, ロゴ, 手指の破綻, 急なカメラの動き"
    duration_param: durationSeconds
    duration_as_string: false   # "4s" 形式を要求された場合は true にする
    poll_interval_sec: 10
    poll_timeout_sec: 900
  minimax:
    # Video Generation V2（公式ドキュメント platform.minimax.io で確認済み）
    #   POST /v2/video_generation -> GET /v2/query/video_generation/{task_id}
    # 国際版アカウントは api.minimax.io、中国本土版は api.minimaxi.com。キーと対応させること。
    model: MiniMax-H3
    base_url: https://api.minimax.io
    api_key_env: MINIMAX_API_KEY
    resolution: 2K                # H3 は 768P / 2K
    min_duration_sec: 4           # H3 は 4〜15秒の整数。短いカットは4秒で作って切りそろえる
    max_duration_sec: 15
    prompt_expansion_mode: ''         # MiniMax-H3 は extra を受け付けない（400: param 'extra' incompatible）
    poll_interval_sec: 10
    poll_timeout_sec: 1200

delivery:
  # 成果物のコピー先。Google Drive デスクトップ版の同期フォルダを指定すると、
  # そのまま Drive に上がる。空なら何もしない（ローカルだけ）。
  # Windows のパスはシングルクォートで囲むこと（バックスラッシュをそのまま扱うため）:
  #   dir: 'G:\マイドライブ\★ Crossactor\AI関連\test\成果物'
  # スラッシュ区切りでもよい:
  #   dir: 'G:/マイドライブ/★ Crossactor/AI関連/test/成果物'
  dir: ''
  auto: true                       # 各工程の完了時に自動でコピーする
  include: [stage1, stage2, output, logs]
  # stage2/_raw（動画APIが返した原本）は大きいのでコピーしない

assemble:
  width: 1920
  height: 1080
  fps: 24
  xfade_duration: 0.5           # クロスディゾルブ
  fade_out_duration: 2.0        # 最後のフェードアウト
  output: pv_16x9.mp4

music:
  enabled: true
  # 画像APIにも動画APIにも「30秒級のBGMを単体で書き出す」公開エンドポイントが無い。
  # 音源を用意したらここにパス（input/ からの相対 or 絶対）を書いて stage3 だけ回す。
  file: ""
  keep_clip_audio: false        # 動画APIが付けた音をそのまま残すか
  reference: "穏やかなアコースティックギターとピアノに、波の環境音を重ねる"

prompts:
  image_common: |
    添付1枚目の建物写真を16:9に拡張する。
    元からある物は変えない：建物・窓割り・素材・照明、および既存の家具や設備の形・位置・色はそのまま。
    何も置かれていない場所に家具や小物を新しく足すのは可。ただし高級宿の設えとして自然な範囲にとどめ、
    元からある物を隠したり押しのけたりしない。
    16:9に広げてできる左右の領域は、写真の端にある壁・床・天井・地面・空をそのまま延長して埋める。
    そこに新しい部屋・ドア・窓・通路・洗面台などの水回り・設備を発明しない。
    人物は添付2枚目の設定シートと同じ顔・髪型・体型にする（30代の日本人夫婦）。
    高級宿泊施設の実写CM品質。自然な光と影、接地感、正しい縮尺。
    禁止：建物の変形、歪み、余分な人物、文字、ロゴ、手指の破綻。
  image_common_no_person: |
    添付1枚目の建物写真を16:9に拡張する。
    元からある物は変えない：建物・窓割り・素材・照明、および既存の家具や設備の形・位置・色はそのまま。
    何も置かれていない場所に家具や小物を新しく足すのは可。ただし高級宿の設えとして自然な範囲にとどめ、
    元からある物を隠したり押しのけたりしない。
    16:9に広げてできる左右の領域は、写真の端にある壁・床・天井・地面・空をそのまま延長して埋める。
    そこに新しい部屋・ドア・窓・通路・洗面台などの水回り・設備を発明しない。
    人物は登場させない。
    高級宿泊施設の実写CM品質。自然な光と影、接地感、正しい縮尺。
    禁止：建物の変形、歪み、余分な人物、手指の破綻。
  # 服装はここだけで決める（共通プロンプト側からは外してある）。
  # 設定シートの服装をそのまま使いたいときは、この値を
  #   wardrobe: '服装は添付の設定シートと同じにする。'
  # に差し替えること。空にすると服装の指定が一切入らなくなる。
  # 全カットの共通プロンプトに差し込まれるので、1か所直せば全カットに効く。
  wardrobe: |
    服装はリゾートカジュアルで全カット統一する。
    夫は麻の半袖シャツと膝丈の短パン。妻はロング丈のリゾートワンピース。
    屋外では夫はレザーサンダル、妻はサンダルを履く。
    どのカットでも同じ服を着ており、途中で着替えない。水着にはしない。
  # cuts.yaml で indoor: true のカットに差し込まれる
  indoor_note: |
    このカットは室内。日本の宿なので靴は履かない。素足か、室内用のスリッパにする。
    サンダルや外履きを室内に持ち込まない。
  image_attachment_note: |
    添付画像の役割：1枚目＝編集対象の建物写真（建物は変更禁止）。2枚目以降＝人物の参照（同一人物に見せるためのもの。顔・髪型・体型をそろえる。背景や構図は取り込まない）。服装は上の指定に従うこと。
  video_common: |
    カメラはゆっくり動かす。建物の直線を歪ませない。人物の顔を変えない。シネマティック、24fps。

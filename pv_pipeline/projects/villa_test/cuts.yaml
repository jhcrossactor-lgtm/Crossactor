# カット定義。別物件でもこのファイルと input/ を差し替えれば流用できる。
#
#   image.mode          : edit = 画像編集APIに通す / skip = 元素材をそのまま使う
#   image.person_reference: true = 人物設定シート＋合格済みカットを参照として添付
#   image.indoor          : true = 室内カット。靴を脱ぐ注記（config の indoor_note）が入る
#   image.references      : 建物の参考画像。"stage1:03"（cut03の生成画像）/ "input:xxx.jpg" / 相対パス
#   image.reference_note  : その参考画像で何を確認させるか
#   video.mode          : ai = image-to-video / passthrough = ffmpegのみ（AIを使わない）

project_name: villa_test
character_sheet: character_sheet.png

# 人物合成の生成順。後ろ姿のカットを先に作り、合格したものを以降の人物参照に足していく。
stage1_order: ["03", "05", "04", "07", "09"]

cuts:
  - id: "01"
    source: 4446557_l.jpg
    duration: 5              # 各パート+2秒（3秒から）
    image:
      mode: edit
      person_reference: false
      instruction: 人物は登場させない。海と建物の風景をそのまま16:9に整える。
    video:
      mode: ai
      instruction: 海上を前進するドローンショット。

  - id: "02"
    transition_in: {type: fadewhite, duration: 0.9}   # 海のまぶしさから芝生へ、光で満たして切り替える
    source: IMG_8613.jpg
    duration: 6              # 各パート+2秒（4秒から）
    image:
      mode: edit
      person_reference: false
      instruction: >-
        人物は登場させない。芝生と建物の佇まいをそのまま見せる。
        撮影者の影・電柱・電線を消去する。芝生と植栽を手入れの行き届いた状態にする。
    video:
      mode: ai
      instruction: >-
        低い位置からゆっくり前進する。構図とカメラの速さは控えめなまま。
        屋外で心地よいそよ風が吹いている。手前の芝生の葉先が、風に合わせてさわさわと波打つように揺れ続ける。
        揺れは画面全体の芝で分かる程度にはっきり、ただし強風にはしない。
        背景の木々の葉もかすかに揺れる。建物・フェンス・壁は一切動かない。

  - id: "03"
    source: ICED2685.JPEG
    duration: 6              # 各パート+2秒（4秒から）
    image:
      mode: edit
      person_reference: true
      instruction: >-
        画面にある茶色い柱2本の手前に、夫婦が並んで座ってくつろぐ。
        向き：背中を茶色い柱と建物に向け、顔と体をプールと海に向ける。視線の方向は「建物→プール」。
        建物や柱のほうを向かせない。振り返らせない。
        カメラの位置に関係なくこの向きを守る。その結果、顔がカメラに写っても構わない。
        座る場所が無ければ、サンラウンジャーかローチェアを2脚だけ新しく置いてよい。
        プールと壁の間の狭い通路には座らせない。水際ぎりぎりに寄せない。
        プールの中には入らない。
        ガラスに映った人物・ブルーシート・ホース・モップを消去し、空を夏の晴天にする。
    video:
      mode: ai
      instruction: ドリーイン。水面がきらめく。夫婦はサンラウンジャーに座ったまま、穏やかにくつろいでいる。立ち上がらない。

  - id: "04"
    source: GGBM1602.JPEG
    duration: 5              # 各パート+2秒（3秒から）
    image:
      mode: edit
      indoor: true
      person_reference: true
      instruction: >-
        階段下で妻が吹き抜けを見上げる。斜め後ろからの構図。
        奥のクジラの絵がある壁は、画面の右端まで同じ壁がそのまま続く。
        その右側に洗面所・洗面台・ドア・別の部屋は存在しない。描き足さない。
    video:
      mode: ai
      instruction: 足元からシャンデリアへティルトアップ。

  - id: "05"
    source: IMG_5558.JPG
    duration: 6              # 各パート+2秒（4秒から）
    image:
      mode: edit
      indoor: true
      person_reference: true
      instruction: 右奥の窓辺で夫婦が海を眺める後ろ姿。空を晴天にする。
    video:
      mode: ai
      instruction: >-
        窓辺で海を眺めていた夫婦が、ゆっくり互いのほうへ向き直り、目を合わせて穏やかに笑い合う。
        顔は横顔まで。カメラに正面を向けない。
        カメラは部屋の奥から二人に向かってゆっくり寄っていき、最後は二人の上半身と窓の海が入る大きさで止まる。
        窓は閉まっていて風は無い。カーテン・植物・布は一切動かさない。画面に無いカーテンを足さない。

  - id: "07"
    source: IMG_5565.JPG
    duration: 5              # 各パート+2秒（3秒から）
    image:
      mode: edit
      indoor: true
      person_reference: true
      instruction: >-
        ソファで夫婦が寄り添って座り、会話している。妻は片手にグラスを持ち、
        夫は妻のほうを向いて穏やかに笑っている。二人とも外は見ていない。
        テレビ画面を海の映像に差し替え、ペットボトルとリモコンを消去する。
    video:
      mode: ai
      instruction: 横スライド。間接照明が少し明るくなる。夫婦はソファに座ったまま、笑顔で会話を続ける。立ち上がらない。

  - id: "06"
    transition_in: {type: fadeblack, duration: 1.2}   # 昼（リビングのソファ）から夜のプールへ。いったん闇に沈めて時間の経過を見せる
    source: IMG_8557.jpg     # 実写MOV(IMG_5625)は画質が落ちるため、夜のプールの写真に差し替え
    duration: 6              # 各パート+2秒（4秒から）
    image:
      mode: edit
      person_reference: true
      instruction: >-
        夜のプールサイド。水中照明で青く光るプールの手前のデッキに、夫婦が並んで立ち、
        それぞれワイングラスを片手に持って、グラスを軽く合わせて乾杯している。二人は向き合って穏やかに笑っている。
        顔は横顔から斜め程度。プールの縁ぎりぎりには立たせない。
        心地よい夜風が吹いていて、妻の髪とワンピースの裾が少しなびいている。
        建物の窓の暖かい明かりとプールの青い光が二人を照らす。夜の実写らしい自然な明暗にする。
    video:
      mode: ai
      instruction: >-
        夜風がそよぎ、妻の髪とワンピースの裾がゆっくりなびく。二人はグラスを軽く合わせたあと、微笑み合う。
        プールの水面が揺らめき、青い光が静かに揺れる。カメラはごくゆっくり横へ動く。建物は動かさない。

  - id: "08"
    source: BIEV8282.JPEG
    duration: 5              # 各パート+2秒（3秒から）
    image:
      mode: edit
      indoor: true
      person_reference: true
      wardrobe: >-
        このカットは夫が一人だけ。妻は登場させない。
        夫はサウナに入っているので、裸で腰に白いバスタオルを巻いている。上半身は裸、素足。服や水着は着ていない。
      instruction: >-
        元写真は縦長のサウナ室。16:9に広げてできる左右の領域には、同じ木のベンチと羽目板の壁、間接照明を
        自然に延長して描く。新しい扉や窓は足さない。
        ベンチの上段に白いタオルを敷き、その上に夫が座っている。
        肌に汗の粒が光り、満足そうにリラックスして笑顔を見せている。顔は斜め前から見える程度。
    video:
      mode: ai
      instruction: >-
        サウナの中で、汗を光らせた夫が満足そうに微笑み、ゆっくり深く息を吐いて肩の力を抜く。
        薄い湯気が静かに漂う。カメラはごくゆっくり前進する。風は無い。

  - id: "09"
    source: IMG_8628.jpg
    duration: 5              # 各パート+2秒（3秒から）
    image:
      mode: edit
      indoor: true
      person_reference: true
      instruction: >-
        妻が奥のデイベッドに普通に腰かけ、脚を伸ばしてくつろぎながら本を読んでいる。
        視線は手元の本に落としている。外は見ていない。
        傍らにカップを1つ置いてよい。
        デイベッドによじ登る・上に立つ・膝立ちになる・身を乗り出す、はしない。
        ティッシュ箱を消去し、ベッドを整える。
    video:
      mode: ai
      instruction: >-
        デイベッドで本を読む妻が、ゆっくり本のページを1枚めくり、ふっと穏やかに微笑む。
        カメラは妻に向かってごくゆっくり前進する。
        窓は閉まっていて風は無い。ブラインドは動かさない。
      # 妻が小さく見えるため、最初のコマを妻に寄せて切り出してから動画化する
      start_crop: {center: [0.68, 0.56], size: 0.6}

  - id: "10"
    transition_in: {type: fade, duration: 1.0}        # 夜の寝室から夜景へ
    source: IMG_5577.JPG
    duration: 11              # 各パート+2秒（9秒から）
    image:
      mode: edit
      person_reference: false
      references: ["input:ref_IMG_8007.jpg", "input:ref_IMG_5654.jpg"]
      reference_note: >-
        1枚目は同じ階段の下から夜に撮った写真で、階段の左にある平屋のリビング棟の位置と大きさが分かる。
        2枚目はそのリビング棟の角の大窓を近くから撮った写真で、窓の中の黄色とグレーのソファとテレビが分かる。
      instruction: >-
        人物は登場させない。電線と電柱を消去する。
        16:9に広げてできる左側の領域には、植栽ではなく、玄関棟の左に続く平屋のリビング棟を描く。
        元写真の左端にわずかに写っている白い壁がその棟の端。参考画像1枚目と同じ位置関係で、
        玄関棟より背の低い白い箱型の平屋。正面に黒枠の横長の大きな窓があり、夜なので室内照明が点いて、
        窓越しに黄色とグレーの大きなソファとテレビが見える（参考画像2枚目の室内）。
        このリビング棟を画面の端で切らず、窓が丸ごと見えるように収める。
        建物の構成は元写真のまま一切変えない。各部の正体は次のとおり：
        ・左側の玄関ドアがある棟：リビングなどの居室。窓の室内照明・家具・シャンデリア・壁画は元写真のまま見せる。
        ・右側の棟の壁にある黒い横長のパネル：屋外ビジョン（プールサイド用の大型画面）。電源オフの黒い画面のまま残す。
          窓・ガラス張りの部屋・壁に作り替えない。
        ・その手前の暗い扉：倉庫の扉。ガラス張りにしない。
        ・プールは水中照明で青く光っている。
        窓を暗くする・カーテンで塞ぐ・室内を空にする、はしない。
        建物のどの部分も切り落とさず、縮めず、別の部屋や棟を足さない。元写真の建物全体を画面内に収める。
        文字は一切入れない（キャッチコピーと施設名は動画の仕上げで重ねる）。左上の夜空はすっきり残す。
    video:
      mode: ai
      instruction: ゆっくり引く。窓の灯りがかすかに揺らぐ。建物は動かさない。文字やロゴは描かない。
      # 文字は動画生成に描かせると崩れるので、仕上げで重ねてゆっくりフェードインさせる
      overlays:
        - {text: "海と、何もしない贅沢を。", font: KozMinPro-Light.otf, size: 0.052, tracking: 0.14,
           x: 0.06, y: 0.14, start: 1.5, fade: 2.2, rise: 0.012}
        # 施設名はエンドカードだけに出す。ここはキャッチコピーの英訳
        - {text: "The sea, and the luxury of doing nothing.", font: GaramondPremrPro-It.otf, size: 0.03, tracking: 0.06,
           x: 0.062, y: 0.232, start: 3.2, fade: 2.0, rise: 0.008}
